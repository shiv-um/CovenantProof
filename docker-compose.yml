services:
  postgres:
    image: postgres:16-alpine
    container_name: covenantproof-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: covenantproof
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d covenantproof"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: covenantproof-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: covenantproof-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covenantproof-api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URI=postgresql://postgres:postgrespassword@postgres:5432/covenantproof?sslmode=disable
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
